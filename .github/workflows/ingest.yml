name: Ingest NFL data

on:
  schedule:
    # 09:00 UTC daily - after games finish and nflverse publishes.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: Season to ingest
        required: false
        default: "2026"

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: poetry

      - name: Install dependencies
        run: poetry install --only main --no-interaction

      - name: Run ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NFL_SEASON: ${{ github.event.inputs.season || 2026 }}
        run: poetry run gridiron-ingest all "$NFL_SEASON"
