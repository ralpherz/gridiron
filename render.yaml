services:
  - type: web
    name: gridiron-api
    runtime: docker
    dockerfilePath: ./src/gridiron/api/Dockerfile
    dockerContext: .
    plan: free
    region: ohio
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: NFL_SEASON
        value: "2026"
